<!DOCTYPE html>
<html lang="en">
<head>
        <title>Simple calculator</title>

    <link rel="stylesheet" href="testpoint.css">
    </head>

    <body>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #f4f4f4;
        }

        .calculator{
            width:400px;
            padding: 20px;
            background: #d8b1b1;
            border-radius: 10px;
        }

        h1{
            text-align: center;
            background: #223447;
            color:white;
            padding:20px;
        }

        .display{
            width: 100%;
            height: 80px;
            font-size: 40px;
            text-align: right;
            margin: 20px 0;
        }
        .buttons{
            display: grid;
            grid-template-columns: repeat(4,1fr);
            gap: 20px;
            
        }
        .button{
            height: 70px;
             font-size: 30px;
             
                     }

               
             .operator{
            background: rgb(188, 144, 62);
            color: aliceblue;
            font-size: 20px;
              }

           </style>
</head>
<body>
    
    <div class="calculator">
        <h1>Simple calculator</h1>
        <input type="text" class="display" value="0">

        <div class="buttons">
            <button>C</button>
            <button>DEL</button>
            <button>%</button>
            <button class="opertar">/</button>

            <button>7</button>
            <button>8</button>
            <button>9</button>
            <button class="operator">*</button>
            
            <button>4</button>
            <button>5</button>
            <button>6</button>
           <button class="operator">-</button>

            <button>1</button>
            <button>2</button>
            <button>3</button>
           <button class="operator">+</button>
            
            <button>0</button>
            <button>.</button>
            
           <button class="operator">=</button>
           
            </div>
            </div>

 </body>
</html>
